name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build:web
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
      - name: iOS JS bundle
        working-directory: apps/mobile
        run: npx expo export --platform ios --output-dir dist-ios

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: denoland/setup-deno@v2
        with: { deno-version: v2.x }
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:functions
      - run: npx supabase start
      - run: npx supabase db lint --level warning
      - name: Serve edge functions (mock AI)
        run: |
          npx supabase functions serve --env-file tests/integration/functions.env &
          sleep 20
      - run: pnpm test:integration
